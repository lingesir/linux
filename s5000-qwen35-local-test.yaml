# 独立排障 Pod：不由 AI 中台管理，不挂载原有 PVC/FUSE。
# 重要：将 hostPath.path 改为 mtt-s5000-01 节点上的真实模型目录。
# 启动前需确保平台原 Pod 已释放全部 8 张 S5000 卡。
apiVersion: v1
kind: Pod
metadata:
  name: qwen35-122b-s5000-local-test
  namespace: ns-18948
  labels:
    app: qwen35-122b-s5000-local-test
spec:
  nodeName: mtt-s5000-01
  restartPolicy: Never
  terminationGracePeriodSeconds: 60
  enableServiceLinks: false
  containers:
    - name: vllm-musa
      image: harbor.telecom-ai.com.cn/images/mt-musa-s5000:v0.24.0-hygon20261102
      imagePullPolicy: Always
      command:
        - /bin/bash
      args:
        - -ilc
        - |
          set -e
          export VLLM_PLUGINS=musa,musa_custom_ops
          export VLLM_WORKER_MULTIPROC_METHOD=spawn
          export PYTHONUNBUFFERED=1
          export SAFETENSORS_FAST_GPU=1
          echo '[INFO] Checking local model files:'
          ls -lh /workspace/local-model/config.json
          find /workspace/local-model -maxdepth 1 -name '*.safetensors' | wc -l
          df -hT /workspace/local-model
          CAPTURE_SIZES="$(seq -s, 4 4 512)"
          exec vllm serve /workspace/local-model/ \
            --trust-remote-code \
            --tensor-parallel-size 8 \
            --served-model-name Qwen3.5-122B-A10B \
            --max-model-len 65536 \
            --max-num-seqs 16 \
            --max-num-batched-tokens 65536 \
            --gpu-memory-utilization 0.82 \
            --mamba-ssm-cache-dtype float32 \
            --no-enable-prefix-caching \
            --no-enable-chunked-prefill \
            --attention-config '{"backend":"FLASH_ATTN"}' \
            --compilation-config "{\"mode\":\"NONE\",\"cudagraph_mode\":\"FULL_DECODE_ONLY\",\"cudagraph_capture_sizes\":[${CAPTURE_SIZES}]}" \
            --speculative-config '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
      env:
        - name: modelName
          value: qwen3-5-122b-a10b
      ports:
        - containerPort: 8000
          protocol: TCP
      resources:
        requests:
          cpu: '50'
          memory: 512Gi
          mthreads.com/gpu: '8'
        limits:
          cpu: '50'
          memory: 512Gi
          mthreads.com/gpu: '8'
      securityContext:
        seccompProfile:
          type: Unconfined
      volumeMounts:
        - name: model-local
          mountPath: /workspace/local-model
          readOnly: true
        - name: shared-memory
          mountPath: /dev/shm
  volumes:
    - name: model-local
      hostPath:
        path: /data01/models/Qwen3.5-122B-A10B
        type: Directory
    - name: shared-memory
      emptyDir:
        medium: Memory
        sizeLimit: 64Gi
